name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  behave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run BDD suite (headless)
        run: behave -D headless=true -f allure_behave.formatter:AllureFormatter -o reports/allure-results -f pretty

      - name: Publish Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results
          retention-days: 7

      - name: Publish JUnit + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behave-artifacts
          path: |
            reports/junit
            reports/behave.log
          retention-days: 7
