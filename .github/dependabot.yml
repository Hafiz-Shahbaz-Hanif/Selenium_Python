version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # behavex and allure-behave both extend Behave (behavex requires behave>=1.2.6,<2),
      # so they are bumped as one set and validated together.
      behave-ecosystem:
        patterns:
          - "behave"
          - "behavex"
          - "allure-behave"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"
